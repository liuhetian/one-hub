services:
  one-hub:
    image: t4f.io/one-hub:latest
    container_name: one-hub
    restart: always
    network_mode: host
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      - SQL_DSN=oneapi:123456@tcp(127.0.0.1:3306)/one-api # host模式需使用127.0.0.1
      - SQL_MAX_IDLE_CONNS=100
      - SQL_MAX_OPEN_CONNS=200
      - REDIS_CONN_STRING=redis://127.0.0.1:6379 # host模式需使用127.0.0.1
      - SESSION_SECRET=random_string # 修改为随机字符串
      - USER_TOKEN_SECRET=random_string # 修改为随机字符串,32位以上
      - TZ=Asia/Shanghai
      - GLOBAL_API_RATE_LIMIT=99999999
      - MEMORY_CACHE_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - LOG_LEVEL=error
      # - HASHIDS_SALT=random_string # 可空，建议设置，字符串元素不能重复
    #      - NODE_TYPE=slave  # 多机部署时从节点取消注释该行
    #      - SYNC_FREQUENCY=60  # 需要定期从数据库加载数据时取消注释该行
    #      - FRONTEND_BASE_URL=https://openai.justsong.cn  # 多机部署时从节点取消注释该行
    depends_on:
      - redis
      - db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' | awk -F: '{print $$2}'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: "${REGISTRY:-docker.io}/redis:latest"
    container_name: redis
    network_mode: host
    restart: always

  db:
    image: "${REGISTRY:-docker.io}/mysql:8.2.0"
    command: --max_connections=2000
    restart: always
    container_name: mysql
    volumes:
      - ./data/mysql:/var/lib/mysql # 挂载目录，持久化存储
    network_mode: host
    environment:
      TZ: Asia/Shanghai # 设置时区
      MYSQL_ROOT_PASSWORD: "OneAPI@justsong" # 设置 root 用户的密码
      MYSQL_USER: oneapi # 创建专用用户
      MYSQL_PASSWORD: "123456" # 设置专用用户密码
      MYSQL_DATABASE: one-api # 自动创建数据库

  mock:
    image: t4f.io/one-hub:latest
    container_name: openai-mock
    entrypoint: /openai-mock
    restart: always
    network_mode: host
    ports:
      - "8080:8080"
